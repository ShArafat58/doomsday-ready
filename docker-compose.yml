services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-doomsday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doomsday}
      POSTGRES_DB: ${POSTGRES_DB:-doomsday}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doomsday}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-doomsday}:${POSTGRES_PASSWORD:-doomsday}@db:5432/${POSTGRES_DB:-doomsday}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
volumes:
  db_data:
